    <div class="modal">
      <div class="modal__body">
        <div class="modal__content">
          <button class="modal__close">X</button>
          <h2>Регистрация</h2>
          <form class="modal__signUp">
            <label for="signUpName" >Введите своё имя:</label>
            <input name="name" id="signUpName" required placeholder="Введите имя..." pattern="[А-ЯЁ][а-яё]+" title="Имя должно начинаться с заглавной русской буквы и содержать только русские буквы (например, Иван)">
            <label for="signUpSurNmae">Введите свою фамилию:</label>
            <input name="surName" id="signUpSurNmae" required placeholder="Введите фамилию..." pattern="[А-ЯЁ][а-яё]+" title="Фамилия должна начинаться с заглавной русской буквы и содержать только русские буквы (например, Иванов)">
            <label for="signUpBirthDate">Введите свою дату рождения:</label>
            <input type="date" name="birthDate" id="signUpBirthDate" required placeholder="Введите дату рождения...">
            <label for="signUpLogin">Придумайте логин:</label>
            <input name="login" id="signUpLogin" required placeholder="Введите Login..." pattern="[a-zA-Z0-9]{3,10}" title="Логин должен состоять только из латинских букв и цифр, от 3 до 10 символов">
            <label for="signUpPassword">Придумайте пароль:</label>
            <input type="password" name="password" id="signUpPassword" required placeholder="Введите пароль..." pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{6,}$" title="Пароль должен быть не менее 6 символов и содержать минимум одну заглавную латинскую букву, одну строчную и одну цифру">
            <label for="signUpPasswordRepeat">Подтвердите пароль:</label>
            <input type="password" name="passwordRepeat" id="signUpPasswordRepeat" required placeholder="Повторите пароль...">
            <input type="submit" value="Зарегистрироваться" id="signUpButton">
          </form>
        </div>
